name: Compilar y verificar DocuTrack
on: [push, pull_request, workflow_dispatch]
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build DocuTrack.csproj --configuration Release
      - run: dotnet run --project Pruebas/DocuTrack.Pruebas.csproj --configuration Release
      - run: dotnet run --project DocuTrack.csproj --configuration Release
